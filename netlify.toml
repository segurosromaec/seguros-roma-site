# Configuración de Netlify para Seguros Roma.
# Se activa al conectar este repositorio (o su directorio base) como sitio en Netlify.

[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    # Fuerza HTTPS durante 1 año, incluye subdominios.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Evita el sniffing de tipo de contenido.
    X-Content-Type-Options = "nosniff"
    # Evita que el sitio se embeba en un <iframe> de otro dominio (clickjacking).
    X-Frame-Options = "DENY"
    # No filtra la URL completa de origen al navegar a sitios externos.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Desactiva APIs sensibles que este sitio no necesita.
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP — punto de partida restrictivo: solo recursos propios. Sin 'unsafe-inline' en
    # script-src a propósito: los scripts propios son archivos en /scripts/, no inline.
    # AJUSTAR explícitamente por dominio al agregar un servicio externo:
    #   - GA4: script-src https://www.googletagmanager.com; connect-src https://www.google-analytics.com
    #     https://region1.google-analytics.com https://www.googletagmanager.com; img-src https://www.google-analytics.com
    #   - Google Fonts: style-src https://fonts.googleapis.com; font-src https://fonts.gstatic.com
    #   - Embed de mapa: frame-src https://www.google.com
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Cache largo para assets con hash en el nombre (Astro los versiona en el build).
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
